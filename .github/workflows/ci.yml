name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Notice we don't need Redis or PostgreSQL containers here!
    # Because our tests are perfectly designed to use SQLite in-memory 
    # and a Mock Redis instance, the CI runs instantly and reliably.

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest suite
      run: |
        pytest tests/ -v
